[package]
name = "maps"
version = "0.1.0"
edition = "2021"
description = "Explore maps in the browser — Rust + WebAssembly"
publish = false

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
  "Path2d",
  "CanvasWindingRule",
  "CssStyleDeclaration",
  "DomRect",
  "Response",
  "WebGl2RenderingContext",
  "WebGlProgram",
  "WebGlShader",
  "WebGlTexture",
  "WebGlUniformLocation",
  "WebGlVertexArrayObject",
  "PointerEvent",
  "MouseEvent",
  "WheelEvent",
  "KeyboardEvent",
  "Event",
  "EventTarget",
  "AddEventListenerOptions",
  "Performance",
  "DomTokenList",
  "History",
  "Location",
  "Navigator",
  "HtmlInputElement",
  "HtmlTextAreaElement",
  "Node",
  "HtmlCollection",
]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
