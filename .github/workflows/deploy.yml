name: Deploy

# Builds the release site and publishes it to Cloudflare Pages: production for
# pushes to main, a preview deployment for each pull request. It needs the
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (see
# docs/deployment.md). Without them, or on pull requests from forks, no deploy happens
# and this workflow still passes.
#
# On main only (push, or a manual run on main), and only if the
# CLOUDFLARE_R2_TOKEN secret is set, the map data is published to the R2
# bucket first: validate against the live data, set CORS, upload the content-
# hashed files that R2 lacks, check they are served, then rewrite
# dist/data/manifest.json to absolute R2 URLs and drop dist/data/files. Every
# step before the Pages deploy fails the job, so a manifest never ships
# pointing at files that are not there. The tile packs listed in
# assets/data/tilesets.json are uploaded separately (publish-tiles.yml); the
# deploy only checks that they are served. Pull requests, dev servers and visual
# tests keep serving the data from the site itself.
#
# Spacecraft and small bodies (assets/data/space.bin, scripts/fetch_space.py)
# are refreshed from NASA JPL's Horizons and Small-Body Database APIs by the
# weekly scheduled run (and by a manual run with "refresh_space"), which then
# deploys main with the fresh file. Pushes to main reuse the live file when it
# is newer than the committed snapshot, so a deploy never rolls the data
# back. Pull requests use the committed snapshot. The browser never calls JPL.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays 05:23 UTC.
    - cron: "23 5 * * 1"
  workflow_dispatch:
    inputs:
      refresh_space:
        description: Fetch fresh spacecraft and small-body data from JPL
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: v0.22.1
  PAGES_PROJECT: biruni
  # Pinned so the R2 commands behave the same on every run.
  WRANGLER_VERSION: 4.164.0
  R2_BUCKET: biruni-data
  R2_BASE_URL: https://biruni-data.jklafka.cloud
  LIVE_MANIFEST_URL: https://biruni.jklafka.cloud/data/manifest.json

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install Trunk
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" trunk
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Space data
        env:
          REFRESH: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_space) }}
          ON_MAIN: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          if [ "$REFRESH" = "true" ]; then
            python3 scripts/fetch_space.py assets/data/space.bin
          elif [ "$ON_MAIN" = "true" ]; then
            python3 scripts/fetch_space.py assets/data/space.bin --from-live "$LIVE_MANIFEST_URL"
          fi
          python3 scripts/fetch_space.py --check assets/data/space.bin
      - name: Release build
        run: trunk build --release
      - name: Validate built data
        run: python3 scripts/validate_data.py dist/data
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    # Fork PRs never receive secrets, so only deploy from this repository.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets are not set; skipping deploy."
          fi
      - name: Check whether to publish data to R2
        id: r2
        env:
          R2_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          ON_MAIN: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          if [ "$ON_MAIN" != "true" ] || [ "${{ steps.creds.outputs.present }}" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$R2_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_R2_TOKEN is not set; deploying with the data served from Pages."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.r2.outputs.enabled == 'true'
      # Checkout cleans the workspace, so it must come before the download.
      - uses: actions/download-artifact@v5
        if: steps.creds.outputs.present == 'true'
        with:
          name: site
          path: dist
      - name: Validate data against the live data
        if: steps.r2.outputs.enabled == 'true'
        run: |
          baseline="$RUNNER_TEMP/baseline"
          python3 scripts/publish_data.py fetch-baseline "$LIVE_MANIFEST_URL" "$baseline"
          if [ -f "$baseline/manifest.json" ]; then
            python3 scripts/validate_data.py dist/data --baseline "$baseline"
          else
            python3 scripts/validate_data.py dist/data
          fi
      - name: Set CORS on the R2 bucket
        if: steps.r2.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
        run: npx --yes "wrangler@${WRANGLER_VERSION}" r2 bucket cors set "$R2_BUCKET" --file scripts/r2-cors.json --force
      - name: Upload new data files to R2
        if: steps.r2.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
        run: |
          python3 scripts/publish_data.py plan dist/data "$R2_BASE_URL" > "$RUNNER_TEMP/missing.tsv"
          echo "$(wc -l < "$RUNNER_TEMP/missing.tsv" | tr -d ' ') new data files to upload"
          while IFS=$'\t' read -r name ctype; do
            echo "uploading $name ($ctype)"
            npx --yes "wrangler@${WRANGLER_VERSION}" r2 object put "$R2_BUCKET/files/$name" \
              --file "dist/data/files/$name" --content-type "$ctype" \
              --cache-control "public, max-age=31536000, immutable" --remote < /dev/null
          done < "$RUNNER_TEMP/missing.tsv"
      - name: Verify every data file is served from R2
        if: steps.r2.outputs.enabled == 'true'
        run: |
          origin=https://biruni.jklafka.cloud
          for f in dist/data/files/*; do
            name="$(basename "$f")"
            want="$(wc -c < "$f" | tr -d ' ')"
            ok=false
            for _ in 1 2 3 4 5 6; do
              got="$(curl -s -o /dev/null -H "Origin: $origin" -D "$RUNNER_TEMP/h" \
                -w '%{http_code} %{size_download}' "$R2_BASE_URL/files/$name" || true)"
              if [ "$got" = "200 $want" ] && grep -qiE "^access-control-allow-origin: (\*|$origin)" "$RUNNER_TEMP/h"; then
                ok=true
                break
              fi
              sleep 5
            done
            if [ "$ok" != true ]; then
              echo "::error::$R2_BASE_URL/files/$name not served correctly (got '$got', want '200 $want' and CORS for $origin)"
              exit 1
            fi
          done
          echo "all data files are served from $R2_BASE_URL"
      - name: Verify the tile packs are served from R2
        if: steps.r2.outputs.enabled == 'true'
        run: python3 scripts/publish_data.py check-tilesets assets/data/tilesets.json
      - name: Point the manifest at R2
        if: steps.r2.outputs.enabled == 'true'
        run: |
          python3 scripts/publish_data.py rewrite dist/data "$R2_BASE_URL"
          cat dist/data/manifest.json
      - name: Deploy
        id: deploy
        if: steps.creds.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.PAGES_PROJECT }} --branch=${{ github.head_ref || github.ref_name }}
      - name: Comment preview URL on the PR
        if: steps.creds.outputs.present == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.deploy.outputs.deployment-url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- cloudflare-pages-preview -->'
          body="$marker"$'\n'"Preview deployed: $URL"$'\n'"Commit: \`${SHA:0:7}\`"
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"$marker\"))][0].id // empty")
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -f body="$body"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$body"
          fi
