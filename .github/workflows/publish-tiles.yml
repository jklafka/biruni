name: Publish tiles

# Builds tile packs from the pinned sources (scripts/make_tiles.py) and
# uploads any that R2 lacks under their content-hashed names. The updated
# assets/data/tilesets.json is attached as the "tilesets" artifact; commit it
# in a pull request to make the app stream the packs. See
# docs/tile-streaming.md. Manual only: packs change only when a source or the
# pyramid does.

on:
  workflow_dispatch:
    inputs:
      layers:
        description: Space-separated layers to build (imagery night terrain)
        required: true
        default: imagery night terrain

permissions:
  contents: read

concurrency:
  group: publish-tiles

env:
  WRANGLER_VERSION: 4.164.0  # keep in step with deploy.yml
  R2_BUCKET: biruni-data
  R2_BASE_URL: https://biruni-data.jklafka.cloud

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Pillow and NumPy
        run: python -m pip install --quiet Pillow numpy
      - name: Build packs
        env:
          LAYERS: ${{ inputs.layers }}
        run: |
          for layer in $LAYERS; do
            python scripts/make_tiles.py build "$layer"
          done
          ls -l .data-cache/tiles
      - name: Upload new packs to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
        run: |
          for f in .data-cache/tiles/*.tiles; do
            name="$(basename "$f")"
            if curl -sfI -H "Origin: https://biruni.jklafka.cloud" "$R2_BASE_URL/files/$name" > /dev/null; then
              echo "$name is already on R2"
              continue
            fi
            echo "uploading $name"
            npx --yes "wrangler@${WRANGLER_VERSION}" r2 object put "$R2_BUCKET/files/$name" \
              --file "$f" --content-type application/octet-stream \
              --cache-control "public, max-age=31536000, immutable" --remote < /dev/null
          done
      - name: Verify the packs are served with ranges and CORS
        run: python scripts/publish_data.py check-tilesets assets/data/tilesets.json
      - name: Show the tilesets.json change
        run: git diff -- assets/data/tilesets.json
      - uses: actions/upload-artifact@v4
        with:
          name: tilesets
          path: assets/data/tilesets.json
