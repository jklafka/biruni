name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: v0.22.1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (wasm32 app)
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings
      - name: Clippy (native, including tests)
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets

  shaders:
    name: Shaders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install glslang
        run: sudo apt-get update -qq && sudo apt-get install -y -qq glslang-tools
      - name: Validate GLSL ES shaders
        run: glslangValidator src/shaders/*.vert src/shaders/*.frag

  data:
    name: Data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generated data matches data-src/
        run: scripts/check-data.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-site
        with:
          trunk-version: ${{ env.TRUNK_VERSION }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-site
        with:
          trunk-version: ${{ env.TRUNK_VERSION }}
      - uses: ./.github/actions/visual-setup
      - name: Compare screenshots with baselines
        working-directory: visual-tests
        run: npm test
      # Always upload the new screenshots, so intentional changes can be
      # promoted to baselines (see README). Diffs exist only on failure.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-screenshots
          path: |
            visual-tests/actual/
            visual-tests/diff/
          retention-days: 14
