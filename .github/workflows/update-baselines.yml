name: Update visual baselines

# Add the `update-baselines` label to a pull request to regenerate
# visual-tests/baselines/ on Linux and push the result to the PR branch.
#
# Why a label on `pull_request` (not workflow_dispatch or issue_comment):
# - `pull_request` runs the workflow file from the PR itself, so it can be
#   tried on the PR that changes it. workflow_dispatch and issue_comment only
#   run the default branch's copy.
# - For PRs from forks GitHub gives the token read-only access, and the job
#   below also refuses them explicitly.
# - Only people with triage access or more can add a label.

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: update-baselines-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  TRUNK_VERSION: v0.22.1

jobs:
  update:
    name: Update baselines
    runs-on: ubuntu-latest
    if: >-
      github.event.label.name == 'update-baselines'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.head.ref != 'main'
      && github.event.pull_request.base.ref == 'main'
    permissions:
      contents: write # push the baselines to the PR branch
      pull-requests: write # remove the label, comment
      actions: write # start CI again on the new commit
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      # Check out the exact commit that was labelled, not the merge ref. If the
      # branch moves while this runs, the push below fails instead of
      # overwriting newer work.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/build-site
        with:
          trunk-version: ${{ env.TRUNK_VERSION }}
      - uses: ./.github/actions/visual-setup
      - name: Regenerate baselines
        working-directory: visual-tests
        run: npm run update
      - name: Commit and push
        id: push
        run: |
          if git diff --quiet -- visual-tests/baselines \
            && [ -z "$(git ls-files --others --exclude-standard visual-tests/baselines)" ]; then
            echo "Baselines already match; nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visual-tests/baselines
          git commit -m "Update visual baselines from Linux CI" \
            -m "Regenerated by the update-baselines workflow on ubuntu-latest."
          git push origin "HEAD:refs/heads/${BRANCH}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # Pushes made with GITHUB_TOKEN do not trigger pull_request workflows, so
      # start CI on the new commit by hand. workflow_dispatch is the one
      # exception to that rule. The run is attached to the commit, so its
      # checks show up on the PR.
      - name: Run CI on the new commit
        if: steps.push.outputs.changed == 'true'
        run: gh workflow run ci.yml --ref "$BRANCH"
      - name: Report and remove label
        if: always()
        run: |
          if [ "${{ steps.push.outputs.changed }}" = "true" ]; then
            msg="Pushed updated visual baselines to \`${BRANCH}\` and started CI. Review the new PNGs in the Files tab."
          elif [ "${{ job.status }}" = "success" ]; then
            msg="Visual baselines already match what CI renders; nothing to commit."
          else
            msg="Updating visual baselines failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
          gh pr comment "$PR" --body "$msg"
          gh pr edit "$PR" --remove-label update-baselines
