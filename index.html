<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Maps</title>
    <link data-trunk rel="rust" data-wasm-opt="z" data-wasm-opt-params="--converge --strip-producers" />
    <link data-trunk rel="copy-dir" href="assets/data" />
    <link data-trunk rel="copy-file" href="assets/_headers" />
    <link data-trunk rel="copy-file" href="assets/raster-worker.js" />
    <style>
      :root {
        --panel: rgba(12, 18, 32, 0.72);
        --border: rgba(255, 255, 255, 0.12);
        --text: #e6ecf5;
        --muted: #9aa8bd;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #02040a;
        color: var(--text);
        font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #globe {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        touch-action: none;
        cursor: grab;
        outline: none;
      }
      #globe.dragging { cursor: grabbing; }
      .panel {
        position: fixed;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        padding: 10px 12px;
        pointer-events: none;
        user-select: none;
      }
      #title { top: 16px; left: 16px; }
      #title h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }
      #title p { margin: 2px 0 0; color: var(--muted); }
      #hud {
        bottom: calc(16px + var(--scrub, 0px));
        left: 16px;
        font-variant-numeric: tabular-nums;
        min-width: 210px;
      }
      #hud div { display: flex; justify-content: space-between; gap: 16px; }
      #hud #hud-scale {
        justify-content: flex-start;
        gap: 8px;
        align-items: center;
        margin-top: 6px;
        cursor: pointer;
        pointer-events: auto;
        -webkit-tap-highlight-color: transparent;
      }
      #hud-scale-bar {
        height: 6px;
        border: 2px solid var(--text);
        border-top: none;
        flex: none;
      }
      #hud #hud-scale-label { color: var(--text); }
      #hud span:first-child { color: var(--muted); }
      #controls {
        position: fixed;
        right: 16px;
        bottom: 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #controls button {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        font-size: 18px;
        cursor: pointer;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      #controls button:hover { background: rgba(40, 56, 88, 0.85); }
      [hidden] { display: none !important; }
      #controls #compass-needle { display: inline-block; width: 22px; height: 22px; line-height: 0; }
      #controls #compass svg { width: 22px; height: 22px; }
      #controls #compass[aria-pressed="true"] { background: var(--panel); }
      #controls #compass[aria-pressed="false"] { background: rgba(90, 130, 210, 0.6); }
      #controls #share svg { width: 18px; height: 18px; vertical-align: middle; }
      #controls button:focus-visible { outline: 2px solid #8fb4ff; outline-offset: 1px; }
      #toast, #share-fallback {
        bottom: calc(150px + var(--scrub, 0px));
        left: 16px;
        max-width: calc(100vw - 88px);
      }
      #share-fallback { pointer-events: auto; width: 340px; display: flex; }
      /* The toast sits above the link box when both show. */
      body:has(#share-fallback:not([hidden])) #toast { bottom: calc(210px + var(--scrub, 0px)); }
      #share-fallback input {
        width: 100%;
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: rgba(0, 0, 0, 0.35);
        color: var(--text);
        font: inherit;
      }
      #controls button[aria-pressed="true"] { background: rgba(90, 130, 210, 0.6); }
      #overlay {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
      }
      #labels {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        user-select: none;
      }
      /* Time scrubber: shown while the terminator is on. It sits at the bottom
         left, clear of the control column. Everything that lives at the bottom
         left (HUD, toast, link box, measure, country info) moves up by --scrub. */
      #scrubber {
        left: 16px;
        bottom: 16px;
        width: min(380px, calc(100vw - 86px));
        pointer-events: auto;
        font-variant-numeric: tabular-nums;
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 4px 8px;
        padding: 8px 12px;
      }
      #scrubber label { color: var(--muted); }
      #scrubber input[type="range"] { width: 100%; min-width: 0; height: 28px; margin: 0; accent-color: #6f9bf0; touch-action: pan-y; }
      #scrubber .val { text-align: right; white-space: nowrap; }
      #scrub-row { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; }
      #scrub-row button {
        min-width: 38px;
        height: 34px;
        padding: 0 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: transparent;
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }
      #scrub-row button:hover { background: rgba(40, 56, 88, 0.85); }
      #scrub-row button:focus-visible, #scrubber input:focus-visible { outline: 2px solid #8fb4ff; outline-offset: 1px; }
      #scrub-row button[aria-pressed="true"] { background: rgba(90, 130, 210, 0.6); }
      #scrub-local { margin-left: auto; color: var(--muted); white-space: nowrap; }
      body { --scrub: 0px; }
      body:has(#scrubber:not([hidden])) { --scrub: 118px; }
      #globe.measuring { cursor: crosshair; }
      #globe.measuring.over-point { cursor: grab; }
      #globe.measuring.over-point.dragging { cursor: grabbing; }
      #measure {
        left: 16px;
        --mb: 168px;
        bottom: calc(var(--mb) + var(--scrub, 0px));
        width: 210px;
        /* Never grow into the title and search box at the top. */
        max-height: min(36vh, calc(100vh - var(--mb) - var(--scrub, 0px) - 150px));
        overflow-y: auto;
        pointer-events: auto;
        font-variant-numeric: tabular-nums;
      }
      #measure[hidden] { display: none; }
      /* Stack above the share toast and link box instead of covering them. */
      body:has(#toast:not([hidden])) #measure { --mb: 204px; }
      body:has(#share-fallback:not([hidden])) #measure { --mb: 214px; }
      body:has(#share-fallback:not([hidden])):has(#toast:not([hidden])) #measure { --mb: 264px; }
      #measure-total { font-size: 16px; font-weight: 600; }
      #measure-hint, #measure-legs { color: var(--muted); }
      #measure-legs { margin: 4px 0 0; padding: 0; list-style: none; }
      #measure-legs li { display: flex; justify-content: space-between; gap: 12px; }
      #measure-actions { display: flex; gap: 6px; margin-top: 8px; }
      #measure-actions button {
        flex: 1;
        min-height: 36px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: transparent;
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }
      #measure-actions button:hover { background: rgba(40, 56, 88, 0.85); }
      #layers {
        z-index: 5; /* its status message hangs below it, over the search box on phones */
        top: 16px;
        right: 16px;
        display: flex;
        gap: 4px;
        padding: 4px;
        pointer-events: auto;
      }
      #layers button {
        min-height: 36px;
        padding: 0 12px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        cursor: pointer;
      }
      #layers button:hover { color: var(--text); }
      #layers button[aria-pressed="true"] { background: rgba(90, 130, 210, 0.45); color: var(--text); }
      #layers button[aria-busy="true"] { opacity: 0.7; cursor: progress; }
      #layers #layer-status {
        /* Below the picker, so a message never resizes it or the panels beside it. */
        position: absolute;
        top: calc(100% + 6px);
        right: 0;
        z-index: 3;
        max-width: calc(100vw - 32px);
        padding: 6px 10px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        white-space: nowrap;
        color: var(--muted);
        font-size: 12px;
      }
      #layers #layer-status[hidden] { display: none; }
      #layers button:focus-visible { outline: 2px solid #8fb4ff; outline-offset: 1px; }
      #controls #proj-button svg { width: 20px; height: 20px; vertical-align: middle; }
      #proj-menu {
        right: 66px;
        bottom: 324px; /* level with the projection button, which tops the column */
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 4px;
        pointer-events: auto;
      }
      #proj-menu[hidden] { display: none; }
      #proj-menu button {
        min-height: 36px;
        padding: 0 14px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      #proj-menu button:hover { color: var(--text); }
      #proj-menu button[aria-pressed="true"] { background: rgba(90, 130, 210, 0.45); color: var(--text); }
      #proj-menu button:focus-visible { outline: 2px solid #8fb4ff; outline-offset: 1px; }
      #search {
        top: 88px;
        left: 16px;
        width: 260px;
        max-width: calc(100vw - 32px);
        padding: 6px;
        pointer-events: auto;
        user-select: auto;
      }
      #search-input {
        width: 100%;
        min-height: 36px;
        padding: 0 10px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: rgba(0, 0, 0, 0.35);
        color: var(--text);
        font: inherit;
        font-size: 16px; /* 16px stops iOS zooming the page on focus */
      }
      #search-input:focus-visible { outline: 2px solid #8fb4ff; outline-offset: 1px; }
      #search-results {
        margin: 6px 0 0;
        padding: 0;
        list-style: none;
        max-height: max(120px, calc(100vh - 260px));
        overflow-y: auto;
      }
      #search-results li {
        display: flex;
        flex-direction: column;
        min-height: 44px;
        justify-content: center;
        padding: 4px 10px;
        border-radius: 7px;
        cursor: pointer;
      }
      #search-results li[aria-selected="true"], #search-results li:hover { background: rgba(90, 130, 210, 0.45); }
      /* The part of a name that matched the query. Bold plus a light tint, so it still reads without color. */
      #search-results mark { background: rgba(255, 214, 102, 0.3); color: inherit; font-weight: 700; border-radius: 2px; }
      .search-sub { color: var(--muted); font-size: 12px; }
      #search-status { margin: 6px 4px 0; color: var(--muted); }
      @media (max-width: 520px) {
        #title p { display: none; }
        #layers { top: 64px; left: 16px; right: auto; }
        #search { top: 116px; }
      }
      #country-info {
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        width: 300px;
        max-width: calc(100vw - 32px);
        pointer-events: auto;
        user-select: text;
      }
      #country-info[hidden] { display: none; }
      #country-info h2 { margin: 0 32px 6px 0; font-size: 16px; font-weight: 600; }
      #country-info div { display: flex; justify-content: space-between; gap: 16px; }
      #country-info div[hidden] { display: none; }
      #country-info div > span:first-child { color: var(--muted); }
      #country-info div > span:last-child { text-align: right; }
      #ci-close {
        position: absolute;
        top: 4px;
        right: 4px;
        width: 36px;
        height: 36px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--muted);
        font-size: 20px;
        cursor: pointer;
      }
      #ci-close:hover { color: var(--text); background: rgba(255, 255, 255, 0.08); }
      #ci-close:focus-visible { outline: 2px solid #8fb4ff; outline-offset: 1px; }
      @media (max-width: 520px) {
        /* Sit above the HUD, left of the control buttons, above the toast and share box (bottom: 150px); measure mode closes this panel. */
        #country-info { left: 16px; right: 70px; bottom: calc(216px + var(--scrub, 0px)); transform: none; width: auto; max-width: none; }
      }
      #loading {
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      #loading.hidden { display: none; }
      #loading.error { color: #ffb4b4; }
    </style>
  </head>
  <body>
    <canvas id="globe" tabindex="0" aria-label="Interactive globe. Drag to rotate, scroll to zoom."></canvas>
    <canvas id="labels" aria-hidden="true"></canvas>
    <canvas id="overlay" aria-hidden="true"></canvas>
    <div id="title" class="panel">
      <h1>Maps</h1>
      <p>Drag to rotate · scroll or pinch to zoom · double-click to fly in</p>
    </div>
    <div id="hud" class="panel">
      <div><span>Cursor</span><span id="hud-cursor">—</span></div>
      <div><span>Center</span><span id="hud-center">—</span></div>
      <div><span>Altitude</span><span id="hud-alt">—</span></div>
      <div><span>Country</span><span id="hud-country">—</span></div>
      <div id="hud-scale" style="display: none" title="Click to switch km / mi (U)">
        <span id="hud-scale-bar"></span><span id="hud-scale-label"></span>
      </div>
    </div>
    <div id="measure" class="panel" hidden>
      <div id="measure-total">0 km</div>
      <div id="measure-hint">Click or tap to add points</div>
      <ul id="measure-legs"></ul>
      <div id="measure-actions">
        <button id="measure-undo" title="Remove the selected point, or the last one (Backspace)">Undo</button>
        <button id="measure-exit" title="Clear and exit (Esc)">Exit</button>
      </div>
    </div>
    <div id="scrubber" class="panel" role="group" aria-label="Time of the day/night terminator" hidden>
      <label for="scrub-date">Date</label>
      <input id="scrub-date" type="range" min="1" max="365" step="1" value="1" aria-label="Day of the year" />
      <span id="scrub-date-val" class="val"></span>
      <label for="scrub-time">UTC</label>
      <input id="scrub-time" type="range" min="0" max="1439" step="1" value="0" aria-label="Time of day, UTC" />
      <span id="scrub-time-val" class="val"></span>
      <div id="scrub-row">
        <button id="scrub-play" aria-pressed="false" title="Play (T)" aria-label="Play">&#9654;</button>
        <button id="scrub-mode" title="Play a day or a year" aria-label="Play mode: day">Day</button>
        <button id="scrub-now" aria-pressed="true" title="Back to the live clock" aria-label="Now">Now</button>
        <span id="scrub-local"></span>
      </div>
    </div>
    <div id="layers" class="panel" role="group" aria-label="Map layer">
      <button id="layer-political" aria-pressed="true" title="Political (1)">Political</button>
      <button id="layer-mono" aria-pressed="false" title="Monochrome (2)">Monochrome</button>
      <button id="layer-imagery" aria-pressed="false" title="Satellite imagery (3)">Satellite</button>
      <div id="layer-status" role="status" hidden></div>
    </div>
    <div id="search" class="panel" role="search">
      <input id="search-input" type="search" role="combobox" aria-label="Search places" aria-autocomplete="list" aria-expanded="false" aria-controls="search-results" placeholder="Search places  ( / )" autocomplete="off" autocapitalize="off" spellcheck="false" />
      <ul id="search-results" role="listbox" aria-label="Matching places" hidden></ul>
      <div id="search-status" role="status" hidden></div>
    </div>
    <div id="controls">
      <button id="proj-button" aria-haspopup="true" aria-expanded="false" aria-controls="proj-menu" title="Projection: Globe (P cycles, G globe)" aria-label="Map projection: Globe">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14"/><path d="M15 6v14"/></svg>
      </button>
      <button id="compass" aria-pressed="true" title="Compass: click to face north (F)" aria-label="Compass. Face north and lock north-up">
        <span id="compass-needle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 L17 12 L7 12 Z" fill="#e0524a"/><path d="M12 22 L17 12 L7 12 Z" fill="#9aa6bd"/><circle cx="12" cy="12" r="1.6" fill="#10151f"/></svg></span>
      </button>
      <button id="zoom-in" title="Zoom in (+)" aria-label="Zoom in">+</button>
      <button id="zoom-out" title="Zoom out (−)" aria-label="Zoom out">−</button>
      <button id="share" title="Share link (S)" aria-label="Share link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
      </button>
      <button id="measure-toggle" aria-pressed="false" title="Measure distance (M)" aria-label="Measure distance">&#128207;</button>
      <button id="sun-toggle" aria-pressed="false" title="Day/night (N)" aria-label="Day and night">&#127763;</button>
      <button id="reset" title="Reset view (R)" aria-label="Reset view">⟲</button>
    </div>
    <div id="proj-menu" class="panel" role="group" aria-label="Map projection" hidden>
      <button data-proj="globe" aria-pressed="true">Globe</button>
      <button data-proj="equirect" aria-pressed="false">Equirectangular</button>
      <button data-proj="mercator" aria-pressed="false">Mercator</button>
      <button data-proj="robinson" aria-pressed="false">Robinson</button>
      <button data-proj="mollweide" aria-pressed="false">Mollweide</button>
    </div>
    <div id="toast" class="panel" role="status" aria-live="polite" hidden></div>
    <div id="share-fallback" class="panel" hidden>
      <input id="share-url" type="text" readonly aria-label="Link to this view. Press Ctrl+C or Cmd+C to copy." />
    </div>
    <div id="country-info" class="panel" role="region" aria-label="Country information" aria-live="polite" hidden>
      <h2 id="ci-title"></h2>
      <button id="ci-close" title="Close (Esc)" aria-label="Close country information">×</button>
      <div id="ci-r0"><span id="ci-l0"></span><span id="ci-v0"></span></div>
      <div id="ci-r1"><span id="ci-l1"></span><span id="ci-v1"></span></div>
      <div id="ci-r2"><span id="ci-l2"></span><span id="ci-v2"></span></div>
      <div id="ci-r3"><span id="ci-l3"></span><span id="ci-v3"></span></div>
    </div>
    <div id="loading" class="panel">Loading map data…</div>
  </body>
</html>
